pluginManagement {
  repositories {
    mavenLocal()
    gradlePluginPortal()
  }
}

if (startParameter.taskNames.contains("generatePluginDiagrams")) {
  dependencyResolutionManagement {
      repositories {
          mavenLocal()
          mavenCentral()
      }
  }
  rootProject.setBuildFileName('build-plugin-diagrams.gradle')
  include ':plugin'
} else {
  include ':plugin'
  include ':examples:dto'
  include ':examples:app'

  rootProject.name = 'plantuml-gradle-plugin-root'
  project(":plugin").name = "plantuml-gradle-plugin"
}
